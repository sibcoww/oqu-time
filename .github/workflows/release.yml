name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0-preview.1"
        required: true
        default: "0.1.0-alpha"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore SchoolScheduler.slnx

      - name: Run tests
        run: dotnet test SchoolScheduler.slnx -c Release --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build release files
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SchoolScheduler-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName
          $releaseOptions = @()
          if ("${{ steps.version.outputs.version }}" -match '-') {
            $releaseOptions += "--prerelease"
          }
          gh release create "${{ github.ref_name }}" $assets `
            --title "${{ github.ref_name }}" `
            --generate-notes @releaseOptions
